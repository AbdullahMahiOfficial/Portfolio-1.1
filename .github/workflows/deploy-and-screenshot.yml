name: Deploy to GitHub Pages & Update Screenshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  update-screenshot:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Capture Full Desktop Screenshot
        run: |
          node -e '
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1920, height: 1080 },
              deviceScaleFactor: 1
            });
            await page.goto("https://abdullahmahiofficial.github.io/Portfolio-1.1/", {
              waitUntil: "networkidle",
              timeout: 60000
            });
            await page.waitForTimeout(3000);
            await page.screenshot({
              path: "public/preview.png",
              fullPage: true
            });
            await browser.close();
          })();
          '

      - name: Commit and Push Updated Screenshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/preview.png
          if git diff --staged --quiet; then
            echo "No screenshot updates detected."
          else
            git commit -m "chore: update full desktop screenshot [skip ci]"
            git push origin main
          fi